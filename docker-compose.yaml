services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-wallet_db}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    container_name: wallet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 5

  db-test:
    image: postgres:17
    container_name: wallet_test_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_test_db
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U wallet_user -d wallet_test_db
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data: